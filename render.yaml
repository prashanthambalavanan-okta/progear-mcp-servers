services:
  - type: web
    name: progear-mcp-gateway
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node packages/gateway/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: OKTA_DOMAIN
        sync: false
      - key: OKTA_INVENTORY_AUTH_SERVER_ID
        sync: false
      - key: OKTA_INVENTORY_AUDIENCE
        sync: false
      - key: OKTA_CUSTOMER_AUTH_SERVER_ID
        sync: false
      - key: OKTA_CUSTOMER_AUDIENCE
        sync: false
      - key: OKTA_SALES_AUTH_SERVER_ID
        sync: false
      - key: OKTA_SALES_AUDIENCE
        sync: false
      - key: OKTA_PRICING_AUTH_SERVER_ID
        sync: false
      - key: OKTA_PRICING_AUDIENCE
        sync: false
      # The demo UI is served by this same process at '/'. Set
      # ENABLE_TESTER_UI=false to serve the MCP endpoints only.
      - key: OKTA_CLIENT_ID
        sync: false
      - key: OKTA_CLIENT_SECRET
        sync: false
      - key: OKTA_AI_AGENT_ID
        sync: false
      - key: OKTA_AI_AGENT_PRIVATE_KEY
        sync: false
