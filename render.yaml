services:
  - type: web
    name: progear-mcp-gateway
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node packages/gateway/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: OKTA_DOMAIN
        sync: false
      - key: OKTA_INVENTORY_AUTH_SERVER_ID
        sync: false
      - key: OKTA_INVENTORY_AUDIENCE
        sync: false
      - key: OKTA_CUSTOMER_AUTH_SERVER_ID
        sync: false
      - key: OKTA_CUSTOMER_AUDIENCE
        sync: false
      - key: OKTA_SALES_AUTH_SERVER_ID
        sync: false
      - key: OKTA_SALES_AUDIENCE
        sync: false
      - key: OKTA_PRICING_AUTH_SERVER_ID
        sync: false
      - key: OKTA_PRICING_AUDIENCE
        sync: false
      # The demo UI is served by this same process at '/'. Set
      # ENABLE_TESTER_UI=false to serve the MCP endpoints only.
      - key: OKTA_CLIENT_ID
        sync: false
      - key: OKTA_CLIENT_SECRET
        sync: false
      # Issuer the human login runs against — the org issuer
      # (https://{domain}) or a Custom AS issuer
      # (https://{domain}/oauth2/{ausId}). Optional: defaults to the org
      # issuer derived from OKTA_DOMAIN.
      - key: OKTA_ISSUER
        sync: false
      - key: OKTA_AI_AGENT_ID
        sync: false
      - key: OKTA_AI_AGENT_PRIVATE_KEY
        sync: false
      # The agent's resource URL. Sent as the RFC 8707 `resource` parameter on
      # the human login so the user's access token is audience-bound to the
      # agent that then runs the ID-JAG exchange. Optional.
      - key: OKTA_AI_AGENT_AUDIENCE
        sync: false
